name: unsaved_changes
description: Detects unsaved changes on editable Flutter surfaces by diffing live state against a captured baseline, and reports what changed.
version: 0.0.2
repository: https://github.com/supy-io/supy-flutter-packages/tree/main/packages/unsaved_changes
issue_tracker: https://github.com/supy-io/supy-flutter-packages/issues
homepage: https://github.com/supy-io/supy-flutter-packages/tree/main/packages/unsaved_changes
topics: [unsaved-changes, dirty-checking, diff, forms, state]

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  collection: ^1.19.1
  flutter:
    sdk: flutter

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  test: ^1.25.15
  very_good_analysis: ^9.0.0

example: example/main.dart
